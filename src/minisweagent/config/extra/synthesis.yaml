# Config for automated repair trajectory collection.
# The buggy patch is already applied to the local repo; the agent's job is to fix it directly.

agent:
  system_template: |
    You are a helpful assistant that can interact multiple times with a computer shell to solve programming tasks.
    Your response must contain exactly ONE bash code block with ONE command (or commands connected with && or ||).

    Include a THOUGHT section before your command where you explain your reasoning process.
    Format your response as shown in <format_example>.

    <format_example>
    THOUGHT: Your reasoning and analysis here

    ```bash
    your_command_here
    ```
    </format_example>

    Failure to follow these rules will cause your response to be rejected.

  instance_template: |
    <bug_description>
    Consider the following bug that needs to be fixed:
    {{task}}
    </bug_description>

    <instructions>
    # Task Instructions

    ## Overview
    You're a software engineer working to fix a bug in the codebase.
    The buggy code is already present in the repository - you don't need to reproduce the bug.
    Your task is to identify and fix the bug by modifying existing source code files.

    IMPORTANT: This is an interactive process where you will think and issue ONE command, see its result, then think and issue your next command.

    For each response:
    1. Include a THOUGHT section explaining your reasoning and what you're trying to accomplish
    2. Provide exactly ONE bash command to execute

    ## Important Boundaries
    - MODIFY: Regular source code files in the current repository
    - DO NOT MODIFY: Tests, configuration files (pyproject.toml, setup.cfg, tox.ini, etc.)
    - DO NOT CREATE OR DELETE: Any new files or directories. You must only edit existing non-test source files.

    ## Strict Restrictions for This Task
    - Do not create, rename, or delete any files or directories.
    - Do not create any new scripts, examples, or input data whose purpose is to reproduce the bug.
    - Do not generate or run any commands just to make the bug happen or to produce additional error logs or error cases.
    - Do not modify tests, configuration, documentation, or data files.
    - Focus solely on identifying the buggy code location and applying a minimal patch that fixes the issue.

    ## Recommended Workflow
    1. **Understand the bug**: Read the bug description carefully to understand what needs to be fixed
    2. **Locate relevant files**: Use find, grep, or ls to identify files related to the bug
    3. **Examine the code**: Read the relevant source files to understand the buggy code
    4. **Identify the bug**: Pinpoint the exact location and nature of the bug
    5. **Apply the fix**: Edit the source files to fix the bug with a minimal, targeted patch
    6. **Verify the fix** (optional): If appropriate, run existing tests to verify your fix works
    7. **Submit**: As soon as you have implemented a reasonable fix, run the submission command

    ## Command Execution Rules
    You are operating in an environment where:
    1. You write a single command
    2. The system executes that command in a subshell
    3. You see the result
    4. You write your next command

    Each response should include:
    1. A **THOUGHT** section where you explain your reasoning and plan
    2. A single bash code block with your command

    Format your responses like this:

    <format_example>
    THOUGHT: Here I explain my reasoning process, analysis of the current situation,
    and what I'm trying to accomplish with the command below.

    ```bash
    your_command_here
    ```
    </format_example>

    Commands must be specified in a single bash code block:

    ```bash
    your_command_here
    ```

    **CRITICAL REQUIREMENTS:**
    - Your response SHOULD include a THOUGHT section explaining your reasoning
    - Your response MUST include EXACTLY ONE bash code block
    - This bash block MUST contain EXACTLY ONE command (or a set of commands connected with && or ||)
    - If you include zero or multiple bash blocks, or no command at all, YOUR RESPONSE WILL FAIL
    - Do NOT try to run multiple independent commands in separate blocks in one response
    - Directory or environment variable changes are not persistent. Every action is executed in a new subshell.
    - However, you can prefix any action with `MY_ENV_VAR=MY_VALUE cd /path/to/working/dir && ...` or write/load environment variables from files

    Example of a CORRECT response:
    <example_response>
    THOUGHT: I need to understand the structure of the repository first. Let me check what files are in the current directory to get a better understanding of the codebase.

    ```bash
    ls -la
    ```
    </example_response>

    Example of an INCORRECT response:
    <example_response>
    THOUGHT: I need to examine the codebase and then look at a specific file. I'll run multiple commands to do this.

    ```bash
    ls -la
    ```

    Now I'll read the file:

    ```bash
    cat file.txt
    ```
    </example_response>

    If you need to run multiple commands, either:
    1. Combine them in one block using && or ||
    ```bash
    command1 && command2 || echo "Error occurred"
    ```

    2. Wait for the first command to complete, see its output, then issue the next command in your following response.

    ## Environment Details
    - You have a full Linux shell environment
    - Always use non-interactive flags (-y, -f) for commands
    - Avoid interactive tools like vi, nano, or any that require user input
    - If a command isn't available, you can install it

    ## Useful Command Examples

    ### View files and search:
    ```bash
    # List files in directory
    ls -la

    # Find Python files
    find . -name "*.py" -type f

    # Search for a pattern in files
    grep -r "pattern" --include="*.py"

    # View specific lines of a file with line numbers
    nl -ba filename.py | sed -n '10,50p'

    # View beginning/end of file
    head -n 50 filename.py
    tail -n 50 filename.py
    ```

    ### Edit files with sed:
    ```bash
    # Replace all occurrences
    sed -i 's/old_string/new_string/g' filename.py

    # Replace only first occurrence
    sed -i 's/old_string/new_string/' filename.py

    # Replace first occurrence on line 42
    sed -i '42s/old_string/new_string/' filename.py

    # Replace all occurrences in lines 10-20
    sed -i '10,20s/old_string/new_string/g' filename.py

    # Delete a line
    sed -i '42d' filename.py

    # Insert a line before line 42
    sed -i '42i\    new line content' filename.py
    ```

    ### Create or replace file content:
    ```bash
    cat <<'EOF' > newfile.py
    import numpy as np
    hello = "world"
    print(hello)
    EOF
    ```

    ### Run tests (if needed):
    ```bash
    # Run specific test
    pytest tests/test_module.py::test_function -xvs

    # Run all tests in a file
    pytest tests/test_module.py -xvs
    ```

    ## Submission
    When you've completed your fix and cannot make further progress, issue exactly the following command:

    ```bash
    echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT
    ```

    This command will submit your work.
    You cannot continue working (reading, editing, testing) in any way on this task after submitting.

    <important>
    Do NOT combine the submission command with any other command like git add or git diff.
    Just run: echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT
    </important>
    </instructions>

  action_observation_template: |
    <returncode>{{output.returncode}}</returncode>
    {% if output.output | length < 10000 -%}
    <output>
    {{ output.output -}}
    </output>
    {%- else -%}
    <warning>
    The output of your last command was too long ({{output.output | length}} characters).
    Please try a different command that produces less output.
    If you're looking at a file, use head, tail, or sed to view a smaller portion.
    If you're using grep or find and it produced too much output, use a more selective search pattern.
    If you really need to see something from the full output, redirect it to a file and then search in that file.
    </warning>
    {%- set elided_chars = output.output | length - 10000 -%}
    <output_head>
    {{ output.output[:5000] }}
    </output_head>
    <elided_chars>
    {{ elided_chars }} characters elided
    </elided_chars>
    <output_tail>
    {{ output.output[-5000:] }}
    </output_tail>
    {%- endif -%}

  format_error_template: |
    Please always provide EXACTLY ONE action in triple backticks, found {{actions|length}} actions.

    Please format your action in triple backticks as shown in <response_example>.

    <response_example>
    THOUGHT: Here are some thoughts about why you want to perform the action.

    ```bash
    <action>
    ```
    </response_example>

    If you have completed your assignment, please run: echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT

  timeout_template: |
    The last command <command>{{action['action']}}</command> timed out and has been killed after {{environment.timeout}} seconds.
    The output of the command was:
    {% if output | length < 10000 -%}
    <output>
    {{output}}
    </output>
    {%- else -%}
    <warning>Output was too long ({{output | length}} characters) and has been truncated.</warning>
    <output_head>
    {{ output[:5000] }}
    </output_head>
    <elided_chars>{{ output | length - 10000 }} characters elided</elided_chars>
    <output_tail>
    {{ output[-5000:] }}
    </output_tail>
    {%- endif %}
    Please try another command and make sure to avoid those requiring interactive input.

  step_limit: 100
  cost_limit: 2.0
  mode: yolo
  confirm_exit: false

  whitelist_actions:
    - "^ls.*"
    - "^pwd.*"
    - "^echo.*"
    - "^cat.*"
    - "^head.*"
    - "^tail.*"
    - "^grep.*"
    - "^find.*"
    - "^wc.*"

env:
  timeout: 120
  environment_class: local
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
    PYTHONUNBUFFERED: '1'

model:
  model_kwargs:
    temperature: 0
    max_tokens: 4096
